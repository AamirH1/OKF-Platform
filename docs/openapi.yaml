        - schema:
            type: string
            minLength: 1
            maxLength: 40
            pattern: ^[\p{L}\p{N}][\p{L}\p{N} _.-]*$
          in: query
          name: tag
          required: false
        - schema:
            type: string
            maxLength: 120

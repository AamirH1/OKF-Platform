paths:
  /api/v1/auth/signup:
    post:
      summary: Create an account and start a session
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
              required:
                - email
                - password
                - name
      security: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      summary: Sign in with email and password
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - email
                - password
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      summary: End the current session
      tags:
        - auth
      responses:
        "204":
          description: Default Response
        "400":
          description: Default Response
          content:

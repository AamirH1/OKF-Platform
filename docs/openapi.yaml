    post:
      summary: "Structured query: select columns, filter, search, sort, paginate"
      tags:
        - query
      description: "Compiled to parameterized SQL against a whitelist of tables/columns. Engine: DuckDB over the version's parquet artifacts."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                table:
                  default: concepts
                  type: string
                  enum:
                    - concepts
                    - links
                    - schema_columns
                columns:
                  maxItems: 50
                  type: array
                  items:
                    type: string
                    maxLength: 64
                filters:
                  default: []
                  maxItems: 20
                  type: array
                  items:
                    type: object
                    properties:
                      column:
                        type: string
                        maxLength: 64
                      op:
                        type: string
                        enum:
                          - eq
                          - neq
                          - lt
                          - lte
                          - gt
                          - gte
                          - contains
                          - starts_with
                          - in
                          - is_null
                          - is_not_null
                          - has
                      value:
                        anyOf:
                          - type: string
                            maxLength: 500
                          - type: number
                          - type: boolean
                          - maxItems: 100
                            type: array
                            items:
                              anyOf:
                                - type: string
                                  maxLength: 500
                                - type: number
                          - type: "null"
                    required:
                      - column
                      - op
                search:
                  type: string
                  maxLength: 200
                sort:
                  default: []
                  maxItems: 5
                  type: array
                  items:
                    type: object
                    properties:
                      column:
                        type: string
                        maxLength: 64
                      direction:
                        type: string
                        enum:
                          - asc
                          - desc
                    required:
                      - column
                      - direction
                page:
                  default: 1
                  type: integer
                  minimum: 1
                  maximum: 100000
                pageSize:
                  default: 50
                  type: integer
                  minimum: 1
                  maximum: 500

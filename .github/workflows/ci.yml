name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: OpenAPI document is up to date
        run: npm run openapi && git diff --exit-code docs/openapi.yaml

  integration:
    name: Integration tests (Postgres, Redis, MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres redis minio && docker compose up minio-init
      - run: npm run test:integration
      - if: failure()
        run: docker compose logs --tail 100

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres redis minio mailpit && docker compose up minio-init
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [check]
    strategy:
      matrix: { target: [api, worker, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: okf-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
